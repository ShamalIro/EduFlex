version: '3.8'

services:

  # ─────────────────────────────────────────
  # MySQL Database
  # ─────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: eduflex-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - eduflex-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
  # ─────────────────────────────────────────
  # User Service
  # ─────────────────────────────────────────
  user-service:
    image: shamal01/eduflex-user-service:latest
    container_name: eduflex-user-service
    environment:
      - PORT=4001
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - DB_NAME=${MYSQL_DATABASE}
      - JWT_SECRET=${JWT_SECRET}
    ports:
      - "4001:4001"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - eduflex-network
    restart: unless-stopped

  # ─────────────────────────────────────────
  # Course Service
  # ─────────────────────────────────────────
  course-service:
    image: shamal01/eduflex-course-service:latest
    container_name: eduflex-course-service
    environment:
      - PORT=4002
      - MONGODB_URI=${COURSE_SERVICE_MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - NODE_ENV=production
    ports:
      - "4002:4002"
    networks:
      - eduflex-network
    restart: unless-stopped

  # ─────────────────────────────────────────
  # Assessment Service
  # ─────────────────────────────────────────
  assessment-service:
    image: shamal01/eduflex-assessment-service:latest
    container_name: eduflex-assessment-service
    environment:
      - PORT=4003
      - MONGODB_URI=${ASSESSMENT_SERVICE_MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - NODE_ENV=production
    ports:
      - "4003:4003"
    networks:
      - eduflex-network
    restart: unless-stopped

  # ─────────────────────────────────────────
  # Enrollment Service
  # ─────────────────────────────────────────
  enrollment-service:
    image: shamal01/eduflex-enrollment-service:latest
    container_name: eduflex-enrollment-service
    environment:
      - PORT=4004
      - MONGODB_URI=${ENROLLMENT_SERVICE_MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - NODE_ENV=production
    ports:
      - "4004:4004"
    networks:
      - eduflex-network
    restart: unless-stopped

  # ─────────────────────────────────────────
  # Payment Service
  # ─────────────────────────────────────────
  payment-service:
    image: shamal01/eduflex-payment-service:latest
    container_name: eduflex-payment-service
    environment:
      - PORT=4005
      - MONGODB_URI=${PAYMENT_SERVICE_MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - NODE_ENV=production
    ports:
      - "4005:4005"
    networks:
      - eduflex-network
    restart: unless-stopped

  # ─────────────────────────────────────────
  # Notification Service
  # ─────────────────────────────────────────
  notification-service:
    image: shamal01/eduflex-notification-service:latest
    container_name: eduflex-notification-service
    environment:
      - PORT=4006
      - MONGODB_URI=${NOTIFICATION_SERVICE_MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - NODE_ENV=production
    ports:
      - "4006:4006"
    networks:
      - eduflex-network
    restart: unless-stopped

  # ─────────────────────────────────────────
  # Discussion Service
  # ─────────────────────────────────────────
  discussion-service:
    image: shamal01/eduflex-discussion-service:latest
    container_name: eduflex-discussion-service
    environment:
      - PORT=4008
      - MONGODB_URI=${DISCUSSION_SERVICE_MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - NODE_ENV=production
    ports:
      - "4008:4008"
    networks:
      - eduflex-network
    restart: unless-stopped

  # ─────────────────────────────────────────
  # API Gateway
  # ─────────────────────────────────────────
  api-gateway:
    image: shamal01/eduflex-api-gateway:latest
    container_name: eduflex-api-gateway
    environment:
      - PORT=3000
      - NODE_ENV=production
      - USER_SERVICE_URL=http://user-service:4001
      - COURSE_SERVICE_URL=http://course-service:4002
      - ASSIGNMENT_SERVICE_URL=http://assessment-service:4003
      - ENROLLMENT_SERVICE_URL=http://enrollment-service:4004
      - GRADE_SERVICE_URL=http://enrollment-service:4004
      - PAYMENT_SERVICE_URL=http://payment-service:4005
      - NOTIFICATION_SERVICE_URL=http://notification-service:4006
      - DISCUSSION_SERVICE_URL=http://discussion-service:4008
      - JWT_SECRET=${JWT_SECRET}
    ports:
      - "3000:3000"
    depends_on:
      - user-service
      - course-service
      - assessment-service
      - enrollment-service
      - payment-service
      - notification-service
      - discussion-service
    networks:
      - eduflex-network
    restart: unless-stopped

  # ─────────────────────────────────────────
  # Frontend (React)
  # ─────────────────────────────────────────
  frontend:
    image: shamal01/eduflex-frontend:latest
    container_name: eduflex-frontend
    ports:
      - "80:80"
    depends_on:
      - api-gateway
    networks:
      - eduflex-network
    restart: unless-stopped

volumes:
  mysql-data:

networks:
  eduflex-network:
    driver: bridge